name: Build DolphinScheduler 3.2.2 for ZooKeeper 3.4.x Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 8 环境与 Maven 缓存
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 3. 自动修复并格式化代码
      - name: Apply Spotless
        run: ./mvnw spotless:apply

      # 4. 开启 -Dzk-3.4 进行全量编译打包
      - name: Full Build with ZK 3.4 Profile
        run: |
          ./mvnw clean install \
            -Dzk-3.4 \
            -DskipTests \
            -Dspotless.check.skip=true \
            -DskipDepCheck=true \
            -Dcheckstyle.skip=true \
            -T 2C

      # 5. 上传编译产物到 Workflow Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphinscheduler-3.2.2-zk34
          path: dolphinscheduler-dist/target/*.tar.gz

      # 6. 发布到 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: 3.2.2-zk34
          name: DolphinScheduler 3.2.2 (Compatible with ZK 3.4.x)
          body: "DolphinScheduler 3.2.2 compiled with -Dzk-3.4 profile to support ZK 3.4.x server."
          files: dolphinscheduler-dist/target/*.tar.gz
          draft: false
          prerelease: false
