name: Build DolphinScheduler 3.2.2 for ZooKeeper 3.4.x

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Official 3.2.2 Tag
        uses: actions/checkout@v4
        with:
          repository: apache/dolphinscheduler
          ref: 3.2.2

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Apply Spotless
        run: ./mvnw spotless:apply

      - name: Build Binary Package
        run: |
          ./mvnw clean install \
            -Prelease \
            -Dzk-3.4 \
            -DskipTests \
            -Dspotless.check.skip=true \
            -DskipDepCheck=true \
            -Dcheckstyle.skip=true \
            -T 2C
            
      - name: Verify ZooKeeper Version
        run: |
          echo "ZooKeeper dependencies:"
          ./mvnw dependency:tree -Dincludes=org.apache.zookeeper:zookeeper
          
      - name: Verify Generated Artifacts
        run: |
          ls -lh dolphinscheduler-dist/target/*.tar.gz
          

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphinscheduler-3.2.2-zk34
          path: dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: 3.2.2-zk34
          name: DolphinScheduler 3.2.2 (ZooKeeper 3.4.x)
          body: |
            DolphinScheduler 3.2.2
            Built with the official ZooKeeper 3.4 compatibility profile.

            Build:
            - Apache DolphinScheduler 3.2.2
            - JDK 8
            - Maven
            - -Dzk-3.4
          files: dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz
          draft: false
          prerelease: false
