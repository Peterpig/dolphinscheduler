name: Build DolphinScheduler 3.2.2 for ZooKeeper 3.4.x

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DolphinScheduler 3.2.2
        uses: actions/checkout@v4
        with:
          repository: apache/dolphinscheduler
          ref: 3.2.2
          fetch-depth: 1

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check Build Environment
        run: |
          java -version
          ./mvnw -version

      - name: Patch guava-retrying Dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dolphinscheduler-common/pom.xml")
          text = path.read_text()

          old = """<dependency>
              <groupId>com.github.rholder</groupId>
              <artifactId>guava-retrying</artifactId>
          </dependency>"""

          new = """<dependency>
              <groupId>com.github.rholder</groupId>
              <artifactId>guava-retrying</artifactId>
              <exclusions>
                  <exclusion>
                      <groupId>com.google.guava</groupId>
                      <artifactId>guava</artifactId>
                  </exclusion>
              </exclusions>
          </dependency>"""

          if old not in text:
              raise SystemExit("Target guava-retrying dependency block not found")

          text = text.replace(old, new, 1)
          path.write_text(text)

          print("Patched dolphinscheduler-common/pom.xml")
          PY

          grep -A10 -B2 "guava-retrying" dolphinscheduler-common/pom.xml

      - name: Apply Spotless
        run: ./mvnw spotless:apply

      - name: Build Binary Package
        run: |
          ./mvnw clean package \
            -Prelease \
            -Dzk-3.4 \
            -Dmaven.test.skip=true \
            -Dspotless.check.skip=true \
            -DskipDepCheck=true \
            -Dcheckstyle.skip=true

      - name: Verify Generated Artifacts
        run: |
          ls -lh dolphinscheduler-dist/target/
          ls -lh dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphinscheduler-3.2.2-zk34
          path: dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: 3.2.2-zk34
          name: DolphinScheduler 3.2.2 - ZooKeeper 3.4
          body: |
            DolphinScheduler 3.2.2 custom build.

            ZooKeeper client: 3.4.14
            Curator: 4.3.0
            Build profile: -Dzk-3.4
            Guava: 31.1-jre
            guava-retrying transitive Guava excluded.
          files: dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz
          draft: false
          prerelease: false
