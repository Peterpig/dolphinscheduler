name: Build DolphinScheduler 3.2.2 for ZooKeeper 3.4.x

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout official DolphinScheduler 3.2.2
      - name: Checkout DolphinScheduler 3.2.2
        uses: actions/checkout@v4
        with:
          repository: apache/dolphinscheduler
          ref: 3.2.2
          fetch-depth: 1

      # 2. Setup JDK 8
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 3. Check build environment
      - name: Check Build Environment
        run: |
          java -version
          ./mvnw -version

      # 4. Apply Spotless
      - name: Apply Spotless
        run: |
          ./mvnw spotless:apply

      # 5. Fix guava-retrying dynamic Guava dependency
      #
      # guava-retrying:2.0.0 declares:
      # com.google.guava:guava:[10.+,)
      #
      # DolphinScheduler 3.2.2 already manages Guava as 31.1-jre,
      # so exclude the problematic transitive Guava dependency.
      - name: Patch guava-retrying Dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("dolphinscheduler-common/pom.xml")
          text = path.read_text()

          pattern = re.compile(
              r'(<dependency>\s*'
              r'<groupId>com\.github\.rholder</groupId>\s*'
              r'<artifactId>guava-retrying</artifactId>\s*)'
              r'(</dependency>)',
              re.MULTILINE
          )

          replacement = r'''\1
                  <exclusions>
                      <exclusion>
                          <groupId>com.google.guava</groupId>
                          <artifactId>guava</artifactId>
                      </exclusion>
                  </exclusions>
              \2'''

          text, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly 1 guava-retrying dependency, found {count}"
              )

          path.write_text(text)

          print("Patched dolphinscheduler-common/pom.xml")
          PY

          echo "===== Verify guava-retrying patch ====="
          grep -A12 -B2 "guava-retrying" dolphinscheduler-common/pom.xml

      # 6. Verify Guava dependency
      - name: Verify Guava Dependency
        run: |
          ./mvnw \
            -pl dolphinscheduler-common \
            -am \
            dependency:tree \
            -Dincludes=com.google.guava:guava \
            -Dzk-3.4 \
            -Dmaven.test.skip=true \
            -Dspotless.skip=true

      # 7. Verify ZooKeeper dependency
      - name: Verify ZooKeeper Dependency
        run: |
          ./mvnw \
            -pl dolphinscheduler-common \
            -am \
            dependency:tree \
            -Dincludes=org.apache.zookeeper:zookeeper,org.apache.curator:curator-framework,org.apache.curator:curator-client,org.apache.curator:curator-recipes \
            -Dzk-3.4 \
            -Dmaven.test.skip=true \
            -Dspotless.skip=true

      # 8. Build DolphinScheduler binary package
      - name: Build Binary Package
        run: |
          ./mvnw clean package \
            -Prelease \
            -Dzk-3.4 \
            -Dmaven.test.skip=true \
            -Dspotless.check.skip=true \
            -DskipDepCheck=true \
            -Dcheckstyle.skip=true \
            -T 2C

      # 9. Verify generated package
      - name: Verify Generated Artifacts
        run: |
          echo "===== dolphinscheduler-dist/target ====="
          ls -lh dolphinscheduler-dist/target/

          echo
          echo "===== Binary Packages ====="
          ls -lh dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz

      # 10. Upload build artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphinscheduler-3.2.2-zk34
          path: dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz
          if-no-files-found: error

      # 11. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: 3.2.2-zk34
          name: DolphinScheduler 3.2.2 - ZooKeeper 3.4
          body: |
            DolphinScheduler 3.2.2 custom binary build.

            Compatibility configuration:
            - DolphinScheduler: 3.2.2
            - ZooKeeper client: 3.4.14
            - Curator: 4.3.0
            - Maven profile: -Dzk-3.4
            - Guava: 31.1-jre
            - guava-retrying transitive Guava dependency excluded

            This build is intended for deployment against ZooKeeper 3.4.x servers.
          files: dolphinscheduler-dist/target/apache-dolphinscheduler-*-bin.tar.gz
          draft: false
          prerelease: false
