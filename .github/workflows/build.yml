name: Build DolphinScheduler 3.2.2 for ZooKeeper 3.4.x

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout official DolphinScheduler 3.2.2
      - name: Checkout DolphinScheduler 3.2.2
        uses: actions/checkout@v4
        with:
          repository: apache/dolphinscheduler
          ref: 3.2.2
          fetch-depth: 1

      # 2. Setup JDK 8
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 3. Check build environment
      - name: Check Build Environment
        run: |
          java -version
          ./mvnw -version

      # 4. Apply Spotless
      - name: Apply Spotless
        run: |
          ./mvnw spotless:apply

      # 5. Fix guava-retrying transitive Guava dependency
      - name: Patch guava-retrying Dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("dolphinscheduler-common/pom.xml")
          text = path.read_text()

          pattern = re.compile(
              r'(<dependency>\s*'
              r'<groupId>com\.github\.rholder</groupId>\s*'
              r'<artifactId>guava-retrying</artifactId>\s*)'
              r'(</dependency>)',
              re.MULTILINE
          )

          replacement = r'''\1
                  <exclusions>
                      <exclusion>
                          <groupId>com.google.guava</groupId>
                          <artifactId>guava</artifactId>
                      </exclusion>
                  </exclusions>
              \2'''

          text, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly 1 guava-retrying dependency, found {count}"
              )

          path.write_text(text)

          print("Patched dolphinscheduler-common/pom.xml")
          PY

          echo "===== Verify guava-retrying patch ====="
          grep -A12 -B2 "guava-retrying" dolphinscheduler-common/pom.xml

      # 6. Build binary package
      - name: Build Binary Package
        run: |
          ./mvnw clean package \
            -Prelease \
            -Dzk-3.4 \
            -Dbuild.assembly.skip=false \
            -Dmaven.test.skip=true \
            -Dspotless.check.skip=true \
            -DskipDepCheck=true \
            -Dcheckstyle.skip=true \
            -T 2C

      # 7. Verify final binary package
      - name: Verify Generated Artifacts
        run: |
          echo "===== dolphinscheduler-dist/target ====="
          ls -lh dolphinscheduler-dist/target/

          PACKAGE="dolphinscheduler-dist/target/apache-dolphinscheduler-3.2.2-bin.tar.gz"

          test -f "$PACKAGE"

          SIZE=$(stat -c%s "$PACKAGE")
          SIZE_MB=$((SIZE / 1024 / 1024))

          echo "Final binary package size: ${SIZE_MB} MB"

          if [ "$SIZE" -gt 524288000 ]; then
            echo "ERROR: Binary package is larger than 500 MB"
            echo "The final assembly/symlink consolidation step may not have executed."
            exit 1
          fi

      # 8. Upload artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphinscheduler-3.2.2-zk34
          path: dolphinscheduler-dist/target/apache-dolphinscheduler-3.2.2-bin.tar.gz
          if-no-files-found: error

      # 9. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: 3.2.2-zk34
          name: DolphinScheduler 3.2.2 - ZooKeeper 3.4
          body: |
            DolphinScheduler 3.2.2 custom binary build.

            - DolphinScheduler: 3.2.2
            - ZooKeeper client: 3.4.14
            - Curator: 4.3.0
            - Maven profile: -Dzk-3.4
            - Guava: 31.1-jre
            - guava-retrying transitive Guava dependency excluded

            Built for ZooKeeper 3.4.x compatibility.
          files: dolphinscheduler-dist/target/apache-dolphinscheduler-3.2.2-bin.tar.gz
          draft: false
          prerelease: false
